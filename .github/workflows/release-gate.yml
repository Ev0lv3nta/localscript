name: Release gate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA или tag для проверки"
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: localscript-release-gate
  cancel-in-progress: false

jobs:
  live:
    name: live GPU
    runs-on: [self-hosted, linux, x64, gpu, localscript-release-gate]
    environment: release-gate
    timeout-minutes: 120
    env:
      LOCALSCRIPT_REQUIRE_LIVE: "1"
      LOCALSCRIPT_STATE_DIR: ${{ github.workspace }}/artifacts/state
      UV_FROZEN: "1"
      UV_NO_PROGRESS: "1"
    steps:
      - name: Получить исходный код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          clean: true
          fetch-depth: 0

      - name: Проверить происхождение ревизии
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "Release gate принимает только commit из истории main." >&2
            exit 1
          }

      - name: Установить Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Зафиксировать проверяемую ревизию
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Установить uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Установить зависимости из lock-файла
        run: uv sync --frozen --extra dev --python 3.12

      - name: Подготовить Lua 5.4
        run: ./scripts/bootstrap_lua54.sh

      - name: Выполнить release gate
        run: >-
          .venv/bin/python scripts/release_gate.py
          --mode competition
          --output artifacts/validation/release-gate.json

      - name: Сохранить отчёты
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-gate-${{ steps.revision.outputs.sha }}
          path: |
            artifacts/validation/release-gate.json
            artifacts/state/runtime_profile.lock.json
          if-no-files-found: warn
          retention-days: 30
