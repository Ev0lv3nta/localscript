services:
  ollama:
    image: ollama/ollama:0.20.7
    gpus: all
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ./artifacts/ollama_home:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s

  localscript:
    build:
      context: .
      dockerfile: Dockerfile
    image: localscript:latest
    environment:
      LOCALSCRIPT_OLLAMA_MODE: remote_api
      LOCALSCRIPT_OLLAMA_HOST: ${LOCALSCRIPT_OLLAMA_HOST:-http://ollama:11434}
      LOCALSCRIPT_PORT: ${LOCALSCRIPT_PORT:-8080}
      LOCALSCRIPT_UI_ENABLED: ${LOCALSCRIPT_UI_ENABLED:-0}
      LOCALSCRIPT_PRIMARY_MODEL: ${LOCALSCRIPT_PRIMARY_MODEL:-qwen3:8b-q4_K_M}
      LOCALSCRIPT_FALLBACK_MODEL: ${LOCALSCRIPT_FALLBACK_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "${LOCALSCRIPT_PORT:-8080}:${LOCALSCRIPT_PORT:-8080}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${LOCALSCRIPT_PORT:-8080}/ready"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 20s
