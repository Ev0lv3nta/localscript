services:
  ollama:
    image: ollama/ollama:0.33.3
    gpus: all
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s

  localscript:
    build:
      context: .
      dockerfile: Dockerfile
    image: localscript:latest
    environment:
      LOCALSCRIPT_OLLAMA_MODE: remote_api
      LOCALSCRIPT_OLLAMA_HOST: http://ollama:11434
      LOCALSCRIPT_ALLOW_REMOTE_OLLAMA: "1"
      LOCALSCRIPT_OLLAMA_CONTAINER_ALIAS: ollama
      LOCALSCRIPT_PORT: ${LOCALSCRIPT_PORT:-8080}
      LOCALSCRIPT_UI_ENABLED: ${LOCALSCRIPT_UI_ENABLED:-1}
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LOCALSCRIPT_PORT:-8080}:${LOCALSCRIPT_PORT:-8080}"
    volumes:
      - localscript_state:/var/lib/localscript
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${LOCALSCRIPT_PORT:-8080}/ready"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 20s

volumes:
  localscript_state:
  ollama_models:
