source:
  provenance: docs/history/hackathon-origin.md
  status: curated_product_rules

runtime_constraints:
  runtime_local_only: true
  external_ai_api_forbidden: true
  preferred_stack: Python + local open-source LLM
  gpu_vram_cap_gb: 8.0
  local_ollama_profile:
    model: qwen3:8b-q4_K_M
    fallback_model: qwen3:8b-q4_K_M
    num_ctx: 4096
    num_predict: 256
    batch: 1
    parallel: 1

api_contract:
  endpoint: POST /generate
  request_json_required:
    - prompt
  response_json_required:
    - code
  default_server: http://localhost:8080

lowcode_lua:
  target_platform_version: "5.5"
  local_validation_runtime: lua5.4_subprocess
  compatibility_note: Generate within the shared Lua 5.4/5.5 subset unless a public example proves otherwise.
  script_wrapper: JsonString lua{ ... }lua
  variable_roots:
    workflow_vars: wf.vars
    init_variables: wf.initVariables
  forbidden_access_patterns:
    - JsonPath
  array_support:
    create_new: _utils.array.new()
    declare_existing: _utils.array.markAsArray(arr)
  allowed_types:
    - nil
    - boolean
    - number
    - string
    - array
    - table
    - function
  allowed_constructs:
    - if...then...else
    - while...do...end
    - for...do...end
    - repeat...until

domain_invariants:
  - Use direct data access through wf.vars or wf.initVariables instead of JsonPath.
  - Use wf.initVariables only for variables passed at launch.
  - Use _utils.array.new() when constructing a new array that must be returned as an array.
  - Never use dangerous stdlib namespaces such as os, io, debug, or package.
  - Return code only, without markdown fences.
  - Preserve platform field names and namespaces from the prompt/context.
