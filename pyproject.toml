[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localscript"
version = "0.2.0"
description = "Локальная генерация и fail-closed проверка LocalScript/Lua через Ollama"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Nikolay Nikitenko" }]
requires-python = ">=3.11,<3.13"
keywords = ["lua", "ollama", "code-generation", "local-first", "validation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
  "fastapi==0.140.0",
  "starlette==1.3.1",
  "uvicorn[standard]==0.51.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "PyYAML==6.0.3",
  "typer==0.27.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.16.2",
]

[project.scripts]
localscript = "app.cli.main:run"

[project.urls]
Homepage = "https://github.com/Ev0lv3nta/localscript"
Documentation = "https://github.com/Ev0lv3nta/localscript#readme"
Issues = "https://github.com/Ev0lv3nta/localscript/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
namespaces = true

[tool.setuptools.package-data]
"app.resources.config.profiles" = ["*.yaml"]
"app.resources" = ["evals/*.json", "evals/**/*.jsonl"]
"app.resources.kb" = ["*.yaml"]
"app.resources.scripts" = ["*.sh"]
"app.ui.static" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
markers = [
  "unit: hermetic tests that do not require a live model backend",
  "integration: tests that require real runtime integration",
  "ollama: tests that require a live Ollama backend",
  "gpu: tests that rely on the judged GPU runtime profile",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["artifacts", "build", "dist", "third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = [
  "app/api/schemas.py",
  "app/domain/outcomes.py",
  "app/families/base.py",
  "app/generation/taskspec.py",
]
plugins = ["pydantic.mypy"]
show_error_codes = true
warn_unused_configs = true
