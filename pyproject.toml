[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "localscript"
version = "0.1.0"
description = "Judged-safe local LocalScript/Lua generator"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.125.0",
  "uvicorn[standard]==0.51.0",
  "pydantic==1.10.26",
  "PyYAML==6.0.3",
  "typer==0.27.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
]

[project.scripts]
localscript = "app.cli.main:run"

[tool.setuptools]
packages = [
  "app",
  "app.api",
  "app.cli",
  "app.core",
  "app.domain",
  "app.generation",
  "app.repair",
  "app.ui",
  "app.validation",
]

[tool.pytest.ini_options]
markers = [
  "unit: hermetic tests that do not require a live model backend",
  "integration: tests that require real runtime integration",
  "ollama: tests that require a live Ollama backend",
  "gpu: tests that rely on the judged GPU runtime profile",
]
